<!doctype html>
<!--
  Presenter view: the real WeGoPub app inside a drawn phone, for showing the
  app on a laptop or projector without mirroring a phone.

  Open  <app address>/app/static/phone.html
  (Streamlit Community Cloud: https://wegopubnow.streamlit.app/~/+/app/static/phone.html)

  The app runs in an iframe of phone size (393 x 764 CSS pixels), so all of its
  mobile layouts apply exactly as on a phone. It is the same site, so the
  saved sign-in, camera and location work as in a normal browser tab (the
  laptop's camera and location). No data is stored here and nothing is loaded
  from other sites.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeGoPub · Phone view</title>
<style>
  :root { --phone-w: 393px; --phone-h: 852px; --bezel: 12px; --status-h: 54px; --home-h: 34px;
          --screen-bg: #F8FAFC; --status-ink: #142B3D; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { overflow: hidden; font-family: system-ui, -apple-system, sans-serif;
         background: radial-gradient(1200px 800px at 50% 30%, #1E3446 0%, #0E1A24 60%, #08111A 100%); }
  .stage { position: absolute; left: 50%; top: 50%; display: flex; align-items: center; gap: 28px;
           transform: translate(-50%, -50%); transform-origin: center; }

  /* The phone: a dark body with a thin metal edge, the screen inset by the bezel. */
  .phone { position: relative; width: calc(var(--phone-w) + 2 * var(--bezel));
           height: calc(var(--phone-h) + 2 * var(--bezel)); padding: var(--bezel); border-radius: 64px;
           background: #0B0D10; box-shadow: 0 0 0 2px #3A4250, 0 0 0 4px #161A20, 0 40px 90px rgba(0, 0, 0, .55); }
  .button { position: absolute; width: 5px; border-radius: 3px; background: #2A3038; box-shadow: inset 0 0 0 1px #3A4250; }
  .button.action { left: -7px; top: 150px; height: 34px; }
  .button.vol-up { left: -7px; top: 210px; height: 62px; }
  .button.vol-down { left: -7px; top: 285px; height: 62px; }
  .button.power { right: -7px; top: 240px; height: 98px; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 52px; overflow: hidden;
            background: var(--screen-bg); display: flex; flex-direction: column; }

  /* Status bar: time left, signal / wifi / battery right, the island in the middle.
     Its colours follow the app's own background (light or dark mode). */
  .status { flex: 0 0 var(--status-h); position: relative; display: flex; align-items: center; justify-content: space-between;
            padding: 6px 34px 0 46px; background: var(--screen-bg); color: var(--status-ink);
            font-weight: 600; font-size: 17px; letter-spacing: -.01em; transition: background .3s, color .3s; }
  .island { position: absolute; left: 50%; top: 11px; width: 124px; height: 36px; transform: translateX(-50%);
            border-radius: 20px; background: #000; }
  .icons { display: flex; align-items: center; gap: 6px; }
  .icons svg { display: block; fill: currentColor; }
  .battery { position: relative; width: 27px; height: 13px; border: 1.5px solid currentColor; border-radius: 4px; opacity: .9; }
  .battery::before { content: ""; position: absolute; inset: 1.5px; right: 6px; border-radius: 2px; background: currentColor; }
  .battery::after { content: ""; position: absolute; right: -4px; top: 3.5px; width: 2px; height: 4px; border-radius: 1px; background: currentColor; }

  .app { flex: 1 1 auto; width: 100%; border: 0; display: block; background: var(--screen-bg); }

  /* Home indicator below the app, like the safe area of a real phone. */
  .home { flex: 0 0 var(--home-h); display: grid; place-items: center; background: var(--screen-bg); transition: background .3s; }
  .home span { width: 134px; height: 5px; border-radius: 3px; background: var(--status-ink); opacity: .85; }

  /* Controls beside the phone (not part of the phone). */
  .controls { display: flex; flex-direction: column; gap: 10px; }
  .controls button { font: 600 14px/1 system-ui, sans-serif; color: #E8F1F7; background: rgba(255, 255, 255, .08);
                     border: 1px solid rgba(255, 255, 255, .16); border-radius: 12px; padding: 11px 14px; cursor: pointer; }
  .controls button:hover { background: rgba(255, 255, 255, .16); }
  .controls button:focus-visible { outline: 3px solid #2C99D6; outline-offset: 2px; }
  @media (max-width: 640px) { .controls { display: none; } }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="phone" aria-label="WeGoPub on a phone">
      <span class="button action" aria-hidden="true"></span>
      <span class="button vol-up" aria-hidden="true"></span>
      <span class="button vol-down" aria-hidden="true"></span>
      <span class="button power" aria-hidden="true"></span>
      <div class="screen">
        <div class="status" aria-hidden="true">
          <span id="clock">9:41</span>
          <span class="island"></span>
          <span class="icons">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.4l1.3-1.4C14.1 1.4 11.4.3 8.5.3S2.9 1.4.9 3.3l1.3 1.4C3.9 3.2 6.1 2.3 8.5 2.3Zm0 3.8c1.4 0 2.7.5 3.7 1.4l1.4-1.4C12.2 4.9 10.4 4.1 8.5 4.1S4.8 4.9 3.4 6.1l1.4 1.4c1-.9 2.3-1.4 3.7-1.4Zm0 3.8c-.6 0-1.1.2-1.5.6l1.5 1.5 1.5-1.5c-.4-.4-.9-.6-1.5-.6Z"/></svg>
            <span class="battery"></span>
          </span>
        </div>
        <iframe class="app" id="app" title="WeGoPub" src="../../"
                allow="camera; geolocation; microphone; clipboard-write; fullscreen"></iframe>
        <div class="home" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <div class="controls">
      <button type="button" id="reload" title="Reload the app inside the phone">Reload app</button>
      <button type="button" id="home" title="Open the start of the app">Start screen</button>
    </div>
  </div>
<script>
  const app = document.getElementById("app");
  const root = document.documentElement.style;
  const APP_URL = "../../";

  // Real time in the status bar, like a phone.
  function tick() {
    const now = new Date();
    document.getElementById("clock").textContent = now.getHours() + ":" + String(now.getMinutes()).padStart(2, "0");
  }
  tick();
  setInterval(tick, 10000);

  // Fit the whole phone on any laptop or projector screen.
  function fit() {
    const phone = 852 + 24 + 8, controls = window.innerWidth > 640 ? 160 : 0;
    const scale = Math.min(1, (window.innerHeight - 24) / phone, (window.innerWidth - 24) / (393 + 24 + controls));
    document.getElementById("stage").style.transform = "translate(-50%, -50%) scale(" + Math.max(scale, 0.4) + ")";
  }
  fit();
  window.addEventListener("resize", fit);

  // Status bar and home area take the app's background colour (light or dark mode).
  // Same site, so the page may read the app's colours; nothing else is read.
  function luminance(rgb) {
    const [r, g, b] = rgb.map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  function followTheme() {
    try {
      const doc = app.contentDocument;
      const target = doc && (doc.querySelector(".stApp") || doc.body);
      if (!target) return;
      const colour = getComputedStyle(target).backgroundColor;
      const rgb = (colour.match(/\d+(\.\d+)?/g) || []).slice(0, 3).map(Number);
      if (rgb.length < 3 || colour.startsWith("rgba(0, 0, 0, 0")) return;
      root.setProperty("--screen-bg", colour);
      root.setProperty("--status-ink", luminance(rgb) > 0.4 ? "#142B3D" : "#E8F1F7");
    } catch (error) {
      // A different site inside the frame cannot be read; keep the default colours.
    }
  }
  setInterval(followTheme, 700);
  app.addEventListener("load", followTheme);

  document.getElementById("reload").addEventListener("click", () => {
    try { app.contentWindow.location.reload(); } catch (error) { app.src = app.src; }
  });
  document.getElementById("home").addEventListener("click", () => { app.src = APP_URL; });
</script>
</body>
</html>
