<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Season recap story (R-S03). Python sends the finished words; this file only animates them.
     Every text is set with textContent, never as HTML. Close is the only value sent back. -->
<style>@import url('https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&display=swap');</style>
<style id="tokens"></style>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}body{padding:2px 2px 10px;background:transparent;color:var(--text,#142B3D);font:16px var(--font-body,system-ui)}
button{font:inherit;cursor:pointer;min-height:44px;border-radius:var(--radius-btn,10px);padding:10px 18px;border:1px solid var(--border);background:var(--surface,#fff);color:var(--text)}
button:focus-visible{outline:3px solid var(--accent,#2C99D6);outline-offset:3px}
.primary{background:var(--accent,#2C99D6);border-color:transparent;color:var(--on-accent,#142B3D);font-weight:700}
.link{background:none;border:0;color:var(--accent-ink,#156A96);font-weight:600;padding:10px 8px}
.icon{display:inline-block;width:28px;height:28px;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}

/* Story: one slide at a time, tap to go on */
#story{position:relative;height:500px;border-radius:var(--radius-lg,16px);overflow:hidden;background:var(--accent-soft,#EAF4FB);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#bars{position:absolute;top:12px;left:12px;right:64px;display:flex;gap:4px;z-index:3}
#bars span{flex:1;height:4px;border-radius:2px;background:rgb(20 43 61/.15);overflow:hidden}
#bars span i{display:block;height:100%;width:0;background:var(--accent-ink,#156A96)}
#bars span.done i{width:100%}
#bars span.now i{animation:fill var(--d) linear forwards}
@keyframes fill{to{width:100%}}
#skip{position:absolute;top:2px;right:4px;z-index:3}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px 32px;text-align:center;opacity:0;visibility:hidden;transform:scale(.94);transition:opacity .45s,transform .45s,visibility .45s}
.slide.on{opacity:1;visibility:visible;transform:none}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted,#52708A);margin:12px 0 4px}
.huge{font-family:var(--font-display,Impact,sans-serif);font-size:56px;line-height:1;margin:8px 0;letter-spacing:.01em}
.winner{font-family:var(--font-display,Impact,sans-serif);font-size:44px;line-height:1.05;margin:6px 0 10px;overflow-wrap:anywhere}
.detail{font-size:17px;color:var(--text-muted,#52708A);max-width:300px;line-height:1.4;margin:0}
.slide .icon{width:56px;height:56px;color:var(--accent-ink,#156A96)}
.on .pop{animation:pop .7s cubic-bezier(.2,1.5,.4,1) both}
.on .pop2{animation:pop .7s .25s cubic-bezier(.2,1.5,.4,1) both}
.on .pop3{animation:pop .7s .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.85)}to{opacity:1;transform:none}}

/* Podium: 2 - 1 - 3, bars rise one after another */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;height:250px;width:100%;margin-top:16px}
.step{width:31%;max-width:96px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.who{text-align:center;max-width:100%}.step b{display:block;font-weight:700;font-size:15px;overflow-wrap:anywhere;margin-bottom:2px}
.step small{display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px}
.block{width:100%;border-radius:10px 10px 0 0;display:flex;justify-content:center;padding-top:8px;font-family:var(--font-display,Impact);font-size:30px;color:var(--text);height:0}
.p1 .block{background:var(--accent,#2C99D6)}.p2 .block{background:var(--medal-2,#C9D6DD)}.p3 .block{background:var(--medal-3,#D7A26B)}
.on .p1 .block{animation:rise1 .9s 1.1s cubic-bezier(.2,1.3,.4,1) both}
.on .p2 .block{animation:rise2 .9s .6s cubic-bezier(.2,1.3,.4,1) both}
.on .p3 .block{animation:rise3 .9s .2s cubic-bezier(.2,1.3,.4,1) both}
.on .p1 .who{animation:pop .5s 1.6s both}.on .p2 .who{animation:pop .5s 1.1s both}.on .p3 .who{animation:pop .5s .7s both}
@keyframes rise1{to{height:150px}}@keyframes rise2{to{height:106px}}@keyframes rise3{to{height:74px}}

/* Confetti on the first slide */
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;opacity:0}
.on .confetti i{animation:fall var(--t) var(--w) ease-in both}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:.9;transform:translateY(540px) rotate(var(--r))}}

/* The static awards card */
#card{background:var(--surface,#fff);border-radius:var(--radius-lg,16px);box-shadow:var(--shadow-card);padding:20px 16px 12px}
#card.enter{animation:pop .5s both}
#card h1{font-family:var(--font-display,Impact);font-weight:400;font-size:34px;margin:0;line-height:1.1}
#card .sub{color:var(--text-muted);margin:2px 0 14px;font-size:14px}
.top3{display:flex;gap:8px;margin-bottom:12px}
.top3 div{flex:1;min-width:0;border-radius:var(--radius-md,10px);padding:8px;text-align:center;background:var(--bg,#F8FAFC)}
.top3 .m1{background:var(--accent-soft,#EAF4FB)}
.top3 span{display:block;font-size:12px;color:var(--text-muted)}.top3 b{display:block;overflow-wrap:anywhere}
.row{display:flex;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--border)}
.row .icon{width:24px;height:24px;color:var(--accent-ink,#156A96);flex:none}
.row div{min-width:0}.row b{display:block;font-size:13px;color:var(--text-muted);font-weight:600}
.row strong{display:block;overflow-wrap:anywhere}.row small{display:block;color:var(--text-muted);font-size:13px}
#card.enter .row{animation:pop .5s both}
.you{background:var(--accent-soft,#EAF4FB);border-radius:var(--radius-md,10px);padding:10px 12px;margin:10px 0 4px}
.you strong{display:block}.you small{color:var(--text-muted);font-size:13px}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<section id="story" hidden aria-live="polite">
 <div id="bars"></div>
 <button id="skip" class="link" type="button">Skip</button>
 <div id="slides"></div>
</section>
<section id="card" hidden>
 <h1>Season awards</h1><p class="sub" id="cardSub"></p>
 <div class="top3" id="top3"></div>
 <div id="rows"></div>
 <div class="you"><strong id="youHead"></strong><small id="youDetail"></small></div>
 <div class="actions"><button id="replay" class="link" type="button">Replay</button><button id="close" class="primary" type="button">Close</button></div>
</section>
<script>
const $=id=>document.getElementById(id);
const send=(type,extra={})=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let args=null,opened=null,slides=[],index=0,timer=null;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
function icon(key){const n=el('span','icon');n.style.setProperty('--i',`url("${args.icons[key]||''}")`);n.setAttribute('aria-hidden','true');return n;}
// Measure the content, not the frame: the frame's own height must never feed back into it.
function height(){send('streamlit:setFrameHeight',{height:Math.ceil(document.body.getBoundingClientRect().height)});}

function slide(parts,ms){const s=el('div','slide');parts.forEach(p=>s.appendChild(p));s.dataset.ms=ms;return s;}
function intro(){
 const c=el('div','confetti');const colours=['var(--accent)','var(--brand)','var(--warning)','var(--success)','var(--medal-3)'];
 for(let k=0;k<36;k++){const i=el('i');i.style.left=(k*97%100)+'%';i.style.background=colours[k%5];
  i.style.setProperty('--t',(1.8+(k%7)*.25)+'s');i.style.setProperty('--w',((k%9)*.12)+'s');i.style.setProperty('--r',(k%2?1:-1)*(180+k*20)+'deg');c.appendChild(i);}
 return slide([c,el('p','eyebrow pop',args.lobby),el('div','huge pop2','Season over'),el('p','detail pop3',args.dates)],3200);
}
function podium(){
 const wrap=el('div','podium');
 [2,1,3].forEach(place=>{const p=args.podium.find(x=>x.place===place);if(!p)return;
  const step=el('div','step p'+place),who=el('div','who');who.append(el('b',null,p.name),el('small',null,p.points+' pts'));
  step.append(who,el('div','block',String(place)));wrap.appendChild(step);});
 return slide([el('p','eyebrow pop','The podium'),wrap],3600);
}
function award(a){return slide([icon(a.key),el('p','eyebrow pop',a.title),el('div','winner pop2',a.winner),el('p','detail pop3',a.detail)],2800);}
function you(){return slide([icon('you'),el('p','eyebrow pop',args.you.title),el('div','winner pop2',args.you.headline),el('p','detail pop3',args.you.detail)],3000);}

function build(){
 slides=[intro()];if(args.podium.length)slides.push(podium());
 args.awards.forEach(a=>slides.push(award(a)));slides.push(you());
 $('slides').replaceChildren(...slides);
 $('bars').replaceChildren(...slides.map(s=>{const b=el('span');b.appendChild(el('i'));return b;}));
 // Static card
 $('cardSub').textContent=args.lobby+', '+args.dates;
 $('top3').replaceChildren(...args.podium.map(p=>{const d=el('div','m'+p.place);d.append(el('span',null,p.place===1?'1st':p.place===2?'2nd':'3rd'),el('b',null,p.name),el('span',null,p.points+' pts'));return d;}));
 $('rows').replaceChildren(...args.awards.map((a,k)=>{const r=el('div','row');r.style.animationDelay=(k*.08)+'s';const t=el('div');
  t.append(el('b',null,a.title),el('strong',null,a.winner),el('small',null,a.detail));r.append(icon(a.key),t);return r;}));
 $('youHead').textContent=args.you.headline;$('youDetail').textContent=args.you.detail;
}
function show(n){
 clearTimeout(timer);if(n>=slides.length)return finish(true);
 index=n;slides.forEach((s,k)=>s.classList.toggle('on',k===n));
 [...$('bars').children].forEach((b,k)=>{b.className=k<n?'done':k===n?'now':'';b.style.setProperty('--d',slides[n].dataset.ms+'ms');
  if(k===n){const i=b.firstChild;i.style.animation='none';void i.offsetWidth;i.style.animation='';}});
 timer=setTimeout(()=>show(n+1),+slides[n].dataset.ms);
}
function play(){$('card').hidden=true;$('story').hidden=false;height();show(0);}
function finish(animated){clearTimeout(timer);$('story').hidden=true;slides.forEach(s=>s.classList.remove('on'));
 const card=$('card');card.hidden=false;card.classList.toggle('enter',!!animated);height();}

$('story').addEventListener('click',e=>{if(e.target.id!=='skip')show(index+1);});
$('skip').onclick=()=>finish(true);
$('replay').onclick=play;
$('close').onclick=()=>send('streamlit:setComponentValue',{value:{action:'close',opened},dataType:'json'});
window.addEventListener('message',event=>{
 if(event.source!==window.parent||event.data?.type!=='streamlit:render')return;
 const next=event.data.args;$('tokens').textContent=next.tokens;
 if(next.opened===opened)return height();  // a rerun must not restart the story
 args=next.recap;opened=next.opened;build();
 if(next.animate&&!reduced)play();else finish(false);
});
window.addEventListener('resize',height);
send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
