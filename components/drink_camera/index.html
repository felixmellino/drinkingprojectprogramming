<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
* { box-sizing: border-box; } body { margin:0; font:15px system-ui,sans-serif; color:#19392f; }
.frame { position:relative; overflow:hidden; border:1px solid #dce5dc; border-radius:22px; background:#edf2e9; box-shadow:0 6px 24px #19392f0c; }
video, img { display:block; width:100%; aspect-ratio:4/3; max-height:460px; object-fit:contain; background:#edf2e9; }
[hidden] { display:none !important; }
.controls { display:flex; justify-content:center; align-items:center; gap:12px; padding:14px; }
button { font:inherit; font-weight:650; cursor:pointer; border-radius:999px; padding:12px 24px; border:1px solid #c9d7c8; background:white; color:#176c50; }
#shutter { background:#176c50; color:white; border:5px solid #dcecbd; min-width:150px; }
button:focus-visible { outline:3px solid #8aab69; outline-offset:3px; } button:disabled { opacity:.55; cursor:wait; }
#status { margin:0; font-size:13px; line-height:1.5; padding:0 8px 10px; color:#576a60; text-align:center; }
</style></head><body>
<div class="frame">
  <video id="video" autoplay playsinline muted aria-label="Live camera preview"></video>
  <img id="photo" alt="Your captured drink photo" hidden>
  <div class="controls">
    <button id="shutter" type="button" disabled>Take photo</button>
    <button id="retake" type="button" hidden>Retake photo</button>
    <button id="retry" type="button" hidden>Retry camera</button>
  </div>
  <p id="status" role="status" aria-live="polite">Opening your camera… Allow camera access if your browser asks.</p>
</div>
<script>
const video = document.getElementById('video');
const photo = document.getElementById('photo');
const shutter = document.getElementById('shutter');
const retake = document.getElementById('retake');
const retry = document.getElementById('retry');
const status = document.getElementById('status');
let stream = null;
let started = false;
let opening = false;
let generation = 0;
let captured = false;
let disposed = false;
function send(type, details) {
  window.parent.postMessage({isStreamlitMessage:true, type, ...details}, '*');
}
function resize() { send('streamlit:setFrameHeight', {height:document.body.scrollHeight}); }
function value(result) { send('streamlit:setComponentValue', {value:result, dataType:'json'}); }
function stopCamera() {
  generation += 1;
  if (stream) stream.getTracks().forEach(track => track.stop());
  stream = null;
  video.srcObject = null;
}
async function openCamera() {
  if (opening || captured || stream || document.hidden || disposed) return;
  opening = true;
  let restart = false;
  const attempt = ++generation;
  retry.hidden = true;
  shutter.disabled = true;
  status.textContent = 'Opening your camera… Allow camera access if your browser asks.';
  try {
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      throw {name:'UnsupportedCamera'};
    }
    const acquired = await navigator.mediaDevices.getUserMedia({audio:false,
      video:{facingMode:{ideal:'environment'}, width:{ideal:1600}, height:{ideal:1200}}});
    if (attempt !== generation || captured) {
      acquired.getTracks().forEach(track => track.stop());
      restart = !document.hidden && !captured && !disposed;
      return;
    }
    stream = acquired;
    video.srcObject = stream;
    await video.play();
    status.textContent = 'Frame your drink, then take the photo.';
  } catch (error) {
    stopCamera();
    const messages = {
      NotAllowedError:'Camera access is blocked. Allow camera access for this site, then retry.',
      NotFoundError:'No camera was found. Open the app on a device with a camera.',
      NotReadableError:'The camera is busy. Close other camera apps, then retry.',
      UnsupportedCamera:'Open the app using its HTTPS address in Safari or Chrome to use the camera.'
    };
    status.textContent = messages[error.name] || 'The camera could not start. Please retry.';
    retry.hidden = false;
  } finally {
    opening = false;
    resize();
    if (restart) openCamera();
  }
}
video.addEventListener('loadeddata', () => { shutter.disabled = !video.videoWidth; resize(); });
shutter.addEventListener('click', () => {
  if (!stream || !video.videoWidth || captured) return;
  const canvas = document.createElement('canvas');
  const scale = Math.min(1, 1600 / Math.max(video.videoWidth, video.videoHeight));
  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  const image = canvas.toDataURL('image/jpeg', .88);
  captured = true;
  photo.src = image;
  photo.hidden = false;
  video.hidden = true;
  shutter.hidden = true;
  retake.hidden = false;
  status.textContent = 'Photo ready. Choose your drink below; your location updates automatically.';
  stopCamera();
  value({capture_id:crypto.randomUUID(), image});
  resize();
});
retake.addEventListener('click', () => {
  captured = false;
  photo.hidden = true;
  photo.removeAttribute('src');
  video.hidden = false;
  shutter.hidden = false;
  retake.hidden = true;
  value(null);
  openCamera();
});
retry.addEventListener('click', openCamera);
photo.addEventListener('load', resize);
window.addEventListener('resize', resize);
window.addEventListener('pagehide', () => { disposed = true; stopCamera(); });
window.addEventListener('pageshow', () => { disposed = false; if (started) openCamera(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopCamera();
  else if (!captured) openCamera();
});
window.addEventListener('message', event => {
  if (event.source !== window.parent || event.data.type !== 'streamlit:render') return;
  if (!started) { started = true; openCamera(); }
  resize();
});
send('streamlit:componentReady', {apiVersion:1});
resize();
</script></body></html>
