<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style id="tokens"></style>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--text);font:16px var(--font-body)}
body{padding:2px 2px 12px}
#row{display:none;align-items:center;gap:12px;min-height:64px;padding:10px 16px;background:var(--surface);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-card)}
#row.show{display:flex}
#text{flex:1;min-width:0}
#title{font-weight:650}
#status{font-size:.82rem;color:var(--text-muted);line-height:1.35;margin-top:2px}
#switch{flex:0 0 auto;position:relative;width:52px;height:32px;border-radius:16px;border:0;padding:0;cursor:pointer;
  background:var(--border);transition:background .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
#switch[aria-checked="true"]{background:var(--accent)}
#switch[aria-checked="true"]::after{transform:translateX(20px)}
#switch:focus-visible{outline:3px solid var(--accent-ink);outline-offset:3px}
</style></head>
<body>
<div id="row"><div id="text"><div id="title">Dark mode</div><div id="status" aria-live="polite"></div></div>
<button id="switch" role="switch" aria-checked="false" aria-label="Dark mode"></button></div>
<script>
// Dark mode on/off, remembered in this browser (same idea as the Location switch).
//  * mode="reader": invisible; tells the page about a saved "dark" or "light" choice.
//  * mode="switch": the visible switch in Profile; a tap saves the choice and tells the page.
const KEY = "wegopub-theme";
const $ = id => document.getElementById(id);
function send(type, details) {window.parent.postMessage({isStreamlitMessage: true, type, ...details}, "*");}
function sendValue(value) {send("streamlit:setComponentValue", {value, dataType: "json"});}
function saved() {try {return localStorage.getItem(KEY);} catch (e) {return null;}}
function save(value) {try {localStorage.setItem(KEY, value);} catch (e) {}}
function show(on) {
  $("switch").setAttribute("aria-checked", on ? "true" : "false");
  $("status").textContent = on ? "On" : "Off";
}
let ready = false;
window.addEventListener("message", event => {
  if (event.source !== window.parent || event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  if (args.tokens) $("tokens").textContent = args.tokens;
  if (ready) return;
  ready = true;
  if (args.mode === "switch") {
    $("row").classList.add("show");
    show(Boolean(args.current));
    send("streamlit:setFrameHeight", {height: $("row").offsetHeight + 16});
    $("switch").addEventListener("click", () => {
      const on = $("switch").getAttribute("aria-checked") !== "true";
      show(on); save(on ? "dark" : "light"); sendValue(on ? "dark" : "light");
    });
  } else {
    send("streamlit:setFrameHeight", {height: 0});
    openPhoneFrame();
    // Light is already the default. An unset preference needs no app rerun.
    const choice = saved();
    if (choice === "dark" || choice === "light") sendValue(choice);
  }
});
// Laptops show the app inside a drawn phone (static/phone.html) at the same address,
// so it looks exactly like on a phone. Decided once per visit by the reader above.
const FRAME = "app/static/phone.html";
const FULL_VIEW = "wegopub-full-view";

// Where to send this page, or null to stay. Pure, so tests can check every case.
//  href: this app page's address; wide: a laptop-size window with a mouse;
//  hostPath: the address path of the page around the app (null if none or unreadable);
//  fullView: the player asked for the normal wide view (?full) in this tab.
function phoneFrameTarget(href, wide, hostPath, fullView) {
  if (!wide || fullView) return null;
  if (hostPath !== null && hostPath.endsWith("/" + FRAME)) return null;   // already inside the phone
  const url = new URL(href);
  const base = url.pathname.startsWith("/~/+/") ? "/~/+/" : "/";          // Streamlit Cloud serves the app under /~/+/
  const page = url.pathname.slice(base.length) + url.search;
  return url.origin + base + FRAME + (page ? "?to=" + encodeURIComponent(page) : "");
}

function openPhoneFrame() {
  try {
    const app = window.parent;
    const query = new URLSearchParams(app.location.search);
    if (query.has("full")) app.sessionStorage.setItem(FULL_VIEW, "1");
    const fullView = app.sessionStorage.getItem(FULL_VIEW) === "1";
    const wide = app.innerWidth >= 700 && app.matchMedia("(hover: hover) and (pointer: fine)").matches;
    let hostPath = null;
    try { hostPath = app.parent === app ? null : app.parent.location.pathname; } catch (e) { return; } // embedded elsewhere: stay
    const target = phoneFrameTarget(app.location.href, wide, hostPath, fullView);
    if (!target) return;
    // Only if the frame page is really there; otherwise keep the normal app.
    // Streamlit sandboxes this component, so it may not navigate the page itself:
    // the page runs the one-line navigation (same site, the address is our own).
    fetch(target, {method: "HEAD", cache: "no-store"})
      .then(response => {
        if (!response.ok) return;
        const script = app.document.createElement("script");
        script.textContent = "location.replace(" + JSON.stringify(target) + ");";
        app.document.head.appendChild(script);
      })
      .catch(() => {});
  } catch (e) {
    // Any surprise: keep the normal app.
  }
}

send("streamlit:componentReady", {apiVersion: 1});
</script></body></html>
