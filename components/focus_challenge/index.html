<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style id="tokens"></style><style>
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:16px var(--font-body);height:100%;overflow:hidden}
[hidden]{display:none!important}main{height:100dvh;overflow:auto;padding:calc(24px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.eyebrow{color:var(--accent-ink);font-size:12px;letter-spacing:.12em;font-weight:700;margin:0}h1{font:32px var(--font-display);margin:0}h2{font-size:24px;margin:8px 0}p{line-height:1.5;margin:8px 0}.muted{color:var(--text-muted)}section{width:100%;max-width:440px;margin:auto 0}.panel{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);padding:24px}
button{font:600 17px var(--font-body);color:var(--text);border:2px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);min-height:48px;touch-action:manipulation;cursor:pointer;user-select:none;-webkit-user-select:none}button:focus-visible{outline:3px solid var(--accent-ink);outline-offset:3px}button:disabled{cursor:wait}button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);padding:16px 28px;width:100%;margin-top:16px}#react{height:min(48vh,330px);width:100%;font-size:32px;background:var(--surface);border:3px solid var(--border)}#react.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}#grid button{aspect-ratio:1/1;font-size:24px}#grid button.flash{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
#arena{position:relative;width:100%;aspect-ratio:1/1;border:2px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);touch-action:manipulation;overflow:hidden}#target{position:absolute;transform:translate(-50%,-50%);width:52px;height:52px;min-height:52px;border-radius:50%;border:2px solid var(--accent-ink);background:var(--accent);color:var(--on-accent);font-size:22px}
.progress{display:flex;gap:6px;width:100%;max-width:440px}.progress span{height:5px;flex:1;background:var(--border);border-radius:9px}.progress span.done{background:var(--accent)}#saving{min-height:22px;font-size:14px;color:var(--accent-ink)}
#flash .big{font:700 64px var(--font-body);font-variant-numeric:tabular-nums;color:var(--accent-ink);margin:12px 0}#flash .try{font-size:18px;color:var(--text-muted);margin:0}
.strip{font-size:14px;color:var(--text-muted);font-variant-numeric:tabular-nums;margin:0}.strip b{color:var(--text)}
#overview{white-space:pre-line;font-size:18px;line-height:1.7;font-variant-numeric:tabular-nums;margin:12px 0}
#falsestart{position:fixed;inset:0;z-index:5;background:#D92D20;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
#falsestart h1{font:700 44px var(--font-body);letter-spacing:.02em;margin:0}#falsestart p{font-size:20px;margin:0}
</style></head><body><main>
<div class="progress" aria-label="Three tests"><span></span><span></span><span></span></div>
<h1 id="title">Reaction Test</h1><p id="strip" class="strip" hidden></p>
<section id="ready" class="panel" hidden><h2 id="readyTitle"></h2><p id="instructions"></p><button id="start" class="primary">I’m ready</button></section>
<section id="reaction" hidden><p id="trial"></p><button id="react" aria-label="Reaction target">WAIT…</button></section>
<section id="flash" class="panel" hidden role="status" aria-live="polite"><p id="flashTry" class="try"></p><div id="flashTime" class="big"></div></section>
<section id="memory" hidden><p id="memoryHint"></p><div id="grid" aria-label="Memory grid"></div></section>
<section id="precision" hidden><p id="precisionHint"></p><div id="arena" aria-label="Precision play area"><button id="target" aria-label="Precision target">1</button></div></section>
<section id="result" class="panel" hidden><h2 id="resultTitle"></h2><div id="overview" aria-label="Reaction times"></div><p id="resultText"></p></section>
<div id="saving" role="status" aria-live="polite"></div>
</main>
<div id="falsestart" role="alert" hidden><h1>FALSE START</h1><p>You tapped before the signal.</p></div><script src="logic.js"></script><script>
let game=null,anchorEpoch=0,anchorMono=0,signature='',pending=null,taps=[],memorySequence=[],sentKey='',flash=null,falseStart=false;
const $=id=>document.getElementById(id),views=['ready','reaction','flash','memory','precision','result'];
const send=(type,extra)=>window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
function now(){return anchorEpoch+performance.now()-anchorMono;}
function load(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback;}catch{return fallback;}}
function store(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch{}}
function emit(action,payload={}){
 if(!game||game.status!=='running')return;
 pending={attempt_id:game.id,revision:game.revision,action,payload};
 store('focus-event-'+game.id,pending);publish();render();
}
function publish(){if(!pending)return;sentKey=JSON.stringify(pending);send('streamlit:setComponentValue',{value:pending,dataType:'json'});}
function cacheTaps(){store('focus-taps-'+game.id,{revision:game.revision,taps});}
function selectView(name){views.forEach(v=>$(v).hidden=v!==name);}
// Reaction times of this attempt: what the server saved, plus the tap still being saved.
function times(){
 const list=[...(game.reaction_ms||[])];
 if(pending?.action==='reaction'&&game.phase==='reaction'&&list.length===game.step)list.push(pending.payload.elapsed_ms);
 return list;
}
const average=list=>Math.round(list.reduce((a,b)=>a+b,0)/list.length);
function render(){
 if(!game)return;
 const at=now(),c=game.config,ended=game.status!=='running';
 $('falsestart').hidden=!falseStart;
 const index=game.phase.startsWith('reaction')?0:game.phase==='memory'?1:2;
 document.querySelectorAll('.progress span').forEach((el,i)=>el.classList.toggle('done',i<index||game.status==='passed'));
 $('saving').textContent=pending?'Saving progress…':'';

 const list=times();$('strip').hidden=ended||!list.length||game.phase==='reaction'||game.phase==='reaction_ready';
 $('strip').textContent='Reaction · '+list.join(' · ')+' ms · average '+(list.length?average(list):0)+' ms';
 if(ended){
  selectView('result');$('title').textContent=game.status==='passed'?'Passed':'Reaction Test';
  $('resultTitle').textContent=game.status==='passed'?'×1.5 earned':'Attempt over';
  const done=times();
  $('overview').textContent=done.length?done.map((t,i)=>'Try '+(i+1)+'   '+t+' ms').join('\n')+'\nAverage   '+average(done)+' ms':'';
  const messages={timeout:'Time ran out.',memory_wrong:'Wrong sequence.',reaction_slow:'Too slow. The middle time must be 350 ms or less.',miss:'Missed target.'};
  $('resultText').textContent=game.status==='passed'?(game.test_mode?'Test mode: play again any time.':'')
   :falseStart?'':messages[game.reason]||'';
  return;
 }
 if(at>=Date.parse(game.expires_at)||(at>Date.parse(game.deadline)&&!pending)){
  if(!pending)emit('fail');return;
 }
 if(game.phase.endsWith('_ready')){
  selectView('ready');$('title').textContent=game.phase==='reaction_ready'?'01 · Reaction':'03 · Precision';
  $('readyTitle').textContent=game.phase==='reaction_ready'?'Tap when TAP NOW appears':'Tap 12 targets in order';
  $('instructions').textContent=game.phase==='reaction_ready'?c.reaction_trials+' tries. Too early is out.':'Fast. One wrong tap is out.';
  $('start').disabled=!!pending;return;
 }
 if(game.phase==='reaction'){
  if(flash&&performance.now()<flash.until){
   selectView('flash');$('title').textContent='01 · Reaction';
   $('flashTry').textContent='Try '+flash.no+' of '+c.reaction_trials;$('flashTime').textContent=flash.ms+' ms';return;
  }
  selectView('reaction');$('title').textContent='01 · Reaction';$('trial').textContent='Try '+(game.step+1)+' of '+c.reaction_trials;
  const go=at>=Date.parse(game.signal_at);$('react').classList.toggle('go',go);
  $('react').textContent=pending?'SAVING…':go?'TAP NOW':'WAIT…';$('react').disabled=!!pending;return;
 }
 if(game.phase==='memory'){
  selectView('memory');$('title').textContent='02 · Memory';
  const preview=at<Date.parse(game.signal_at),frame=FocusLogic.memoryFrame({...game,memory:memorySequence},at);
  $('memoryHint').textContent=preview?'Watch':'Repeat · '+game.step+' of '+c.memory_length;
  [...$('grid').children].forEach((b,i)=>{b.disabled=preview||!!pending;b.classList.toggle('flash',preview&&frame===i);});return;
 }
 if(game.phase==='precision'){
  selectView('precision');$('title').textContent='03 · Precision';
  $('precisionHint').textContent=taps.length+' of '+c.precision_targets;
  const pos=game.positions?.[taps.length];
  $('target').hidden=!pos||at>=Date.parse(game.deadline);
  if(pos){$('target').style.left=(pos.x/10)+'%';$('target').style.top=(pos.y/10)+'%';$('target').textContent=String(taps.length+1);}
 }
}
$('start').onclick=()=>{if(!pending)emit('ready');};
function reactionPress(){
 if(pending||!game||game.status!=='running')return;
 const elapsed=Math.floor(now()-Date.parse(game.signal_at));
 if(elapsed<0){falseStart=true;store('focus-false-'+game.id,true);emit('fail');return;}   // red screen at once
 if(elapsed>game.config.reaction_response_ms){emit('fail');return;}
 flash={ms:elapsed,no:game.step+1,until:performance.now()+1400};
 emit('reaction',{elapsed_ms:elapsed});
}
$('react').addEventListener('pointerdown',event=>{event.preventDefault();reactionPress();});
$('react').addEventListener('keydown',event=>{if(!event.repeat&&['Enter',' '].includes(event.key)){event.preventDefault();reactionPress();}});
for(let i=0;i<9;i++){
 const b=document.createElement('button');b.textContent=String(i+1);b.setAttribute('aria-label','Memory cell '+(i+1));
 b.onclick=()=>{if(!pending&&now()>=Date.parse(game.signal_at))emit('memory',{cell:i});};$('grid').appendChild(b);
}
$('target').onclick=event=>{
 event.stopPropagation();if(!game||game.status!=='running'||taps.length>=game.config.precision_targets)return;
 const elapsed=Math.floor(now()-Date.parse(game.signal_at));
 if(elapsed<0||elapsed>game.config.precision_ms){emit('fail');return;}
 taps.push(Math.max(elapsed,(taps.at(-1)??-1)+1));cacheTaps();
 // Send full prefixes. Clicks remain local and responsive while requests travel.
 emit('precision',{taps:[...taps]});render();
};
$('arena').onclick=event=>{if(event.target!==$('target')&&game?.status==='running'&&game?.phase==='precision')emit('fail');};
window.addEventListener('message',event=>{
 if(event.source!==window.parent||event.data?.type!=='streamlit:render')return;
 const args=event.data.args,a=args?.attempt;if(!a?.id||!Number.isInteger(a.revision))return;
 $('tokens').textContent=args.tokens||'';
 const next=a.id+':'+a.revision;
 if(next!==signature){signature=next;anchorEpoch=Date.parse(a.server_now);anchorMono=performance.now();pending=null;sentKey='';memorySequence=[];}
 game=a;falseStart=load('focus-false-'+a.id,false)===true;
 if(a.memory)memorySequence=[...a.memory];
 const cached=load('focus-taps-'+a.id,{});
 taps=a.phase==='precision'?FocusLogic.mergeTaps(a.precision_taps||[],cached.revision===a.revision?cached.taps:[],a.config):[];
 const saved=load('focus-event-'+a.id,null);
 if(saved&&saved.revision===a.revision&&a.status==='running'){
  const ack=saved.action==='precision'&&(a.precision_taps||[]).length>=saved.payload.taps.length;
  if(!ack){pending=saved;if(JSON.stringify(saved)!==sentKey)publish();}else{pending=null;store('focus-event-'+a.id,null);}
 }else{store('focus-event-'+a.id,null);}
 if(a.status!=='running'){pending=null;store('focus-event-'+a.id,null);store('focus-taps-'+a.id,null);}
 render();send('streamlit:setFrameHeight',{height:window.innerHeight});
});
setInterval(render,16);
window.addEventListener('resize',()=>send('streamlit:setFrameHeight',{height:window.innerHeight}));
send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
