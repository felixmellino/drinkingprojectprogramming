<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style id="tokens"></style>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--text);font:16px var(--font-body)}
body{padding:2px 2px 12px}  /* room for the card's shadow inside the frame */
#row{display:none;align-items:center;gap:12px;min-height:64px;padding:10px 16px;background:var(--surface);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-card)}
#row.show{display:flex}
#text{flex:1;min-width:0}
#title{font-weight:650}
#status{font-size:.82rem;color:var(--text-muted);line-height:1.35;margin-top:2px}
#status.bad{color:var(--danger,#B42318)}
#switch{flex:0 0 auto;position:relative;width:52px;height:32px;border-radius:16px;border:0;padding:0;cursor:pointer;
  background:var(--border);transition:background .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
#switch[aria-checked="true"]{background:var(--accent)}
#switch[aria-checked="true"]::after{transform:translateX(20px)}
#switch:focus-visible{outline:3px solid var(--accent-ink);outline-offset:3px}
#switch:disabled{opacity:.6;cursor:wait}
/* Compact: label and a small switch on the Map's own frosted-white shape (drawn by the page around this frame);
   the status stays for screen readers. */
body.compact{padding:3px 1px}
body.compact #row{display:none;width:fit-content;min-height:0;margin:0 auto;gap:8px;padding:0;background:transparent;box-shadow:none}
body.compact #row.show{display:flex}
body.compact #title{font-size:.8rem;font-weight:600;color:var(--text)}
body.compact #status{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;margin:0}
body.compact #switch{width:30px;height:18px;border-radius:9px}
body.compact #switch::after{top:2px;left:2px;width:14px;height:14px}
body.compact #switch[aria-checked="true"]::after{transform:translateX(12px)}
</style></head>
<body>
<div id="row"><div id="text"><div id="title">Location</div><div id="status" aria-live="polite"></div></div>
<button id="switch" role="switch" aria-checked="false" aria-label="Location"></button></div>
<script>
// Phone location for Check-in, Map and the minigames (R-L01, R-L04).
//
// Two modes:
//  * default (no argument): an invisible follower. It only runs when the player has turned
//    location ON in Profile (saved in this browser). A browser that has forgotten its answer
//    (Safari does, per visit) is probed briefly; if it does not hand out a position quickly the
//    follower reports {error:"off"} and the player taps the switch again. Never turned on:
//    it asks nothing at all and reports {error:"off"}.
//  * mode="switch": the visible Location switch (Profile; compact=true is the small pill on the Map,
//    which with follow=true also follows the position while it is on). The player's tap is a real gesture
//    inside this frame, so the browser (Safari too) asks for permission right then.
// Sends {lat, lng, accuracy_m, taken_at_ms} when the player gets a fix, moves more than
// MIN_MOVE_M, crosses the 50 m accuracy limit, or every HEARTBEAT_MS so the reading stays fresh.
// Nothing is stored here but the on/off choice; coordinates only live in the open session.
const KEY = "wegopub-location";
const MIN_MOVE_M = 20, ACCURACY_LIMIT_M = 50, HEARTBEAT_MS = 30000;
const OPTIONS = {enableHighAccuracy: true, maximumAge: 5000, timeout: 20000};

let started = false, lastSent = null, lastSentAt = 0, lastError = null, latest = null, watchId = null, beatId = null;

function send(type, details) {window.parent.postMessage({isStreamlitMessage: true, type, ...details}, "*");}
function sendValue(value) {send("streamlit:setComponentValue", {value, dataType: "json"});}
// null when never chosen. If the browser blocks storage the choice cannot be saved: follow as before.
function chosen() {try {return localStorage.getItem(KEY);} catch (e) {return "unsaved";}}
function choose(value) {try {localStorage.setItem(KEY, value);} catch (e) {}}
async function permission() {
  try {return (await navigator.permissions.query({name: "geolocation"})).state;} catch (e) {return "unknown";}
}
function metresBetween(a, b) {
  const rad = Math.PI / 180;
  const x = (b.lng - a.lng) * rad * Math.cos(((a.lat + b.lat) / 2) * rad);
  const y = (b.lat - a.lat) * rad;
  return Math.sqrt(x * x + y * y) * 6371000;
}
function reading(position) {
  return {lat: position.coords.latitude, lng: position.coords.longitude,
          accuracy_m: position.coords.accuracy, taken_at_ms: position.timestamp};
}
const errorName = error => ({1: "denied", 2: "unavailable", 3: "timeout"}[error.code] || "unavailable");

// ---- invisible follower ---------------------------------------------------------------
function onPosition(position) {
  latest = reading(position);
  const moved = !lastSent || metresBetween(lastSent, latest) > MIN_MOVE_M;
  const accuracyChanged = lastSent &&
    (lastSent.accuracy_m <= ACCURACY_LIMIT_M) !== (latest.accuracy_m <= ACCURACY_LIMIT_M);
  if (moved || accuracyChanged || Date.now() - lastSentAt >= HEARTBEAT_MS || lastError) {
    lastSent = latest; lastSentAt = Date.now(); lastError = null;
    sendValue(latest);
  }
}
function onError(error) {
  const code = errorName(error);
  if (code === "timeout" && latest) return;   // a slow fix while we have a recent one is not news
  if (code !== lastError) {lastError = code; sendValue({error: code});}
}
// The browser would ask again (or cannot say): one quick try. No quick answer means the player
// has to tap a switch (an invisible frame cannot show the browser's question reliably).
const probe = () => new Promise(resolve => navigator.geolocation.getCurrentPosition(
  position => {onPosition(position); resolve(true);}, () => resolve(false), {...OPTIONS, timeout: 4000}));
async function follow() {
  if (started) return;
  started = true;
  if (!navigator.geolocation) {sendValue({error: "unsupported"}); return;}
  if (chosen() !== "on" && chosen() !== "unsaved") {sendValue({error: "off"}); return;}
  const state = await permission();
  if (state === "denied") {sendValue({error: "denied"}); return;}
  if (state !== "granted" && !(await probe())) {sendValue({error: "off"}); return;}
  startFollowing();
}
function startFollowing() {
  if (watchId !== null) return;
  watchId = navigator.geolocation.watchPosition(onPosition, onError, OPTIONS);
  // Standing still produces no new watch events, so ask again regularly.
  beatId = setInterval(() => navigator.geolocation.getCurrentPosition(onPosition, onError, OPTIONS), HEARTBEAT_MS);
}
function stopFollowing() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  if (beatId !== null) clearInterval(beatId);
  watchId = beatId = null; lastSent = null; latest = null;
}

// ---- visible switch in Profile ----------------------------------------------------------
const $ = id => document.getElementById(id);
const OFF = "Off. Turn it on to check in and see where you are on the map.";
const BLOCKED = "Blocked. On iPhone: Settings → Privacy & Security → Location Services → Safari Websites → While Using, " +
  "then Settings → Safari → Location → Ask or Allow. Then turn this on again.";
function show(on, text, bad) {
  $("switch").setAttribute("aria-checked", on ? "true" : "false");
  $("status").textContent = text;
  $("status").className = bad ? "bad" : "";
  send("streamlit:setFrameHeight", {height: $("row").offsetHeight + (document.body.classList.contains("compact") ? 6 : 16)});
}
async function showSwitch(compact, followToo) {
  if (started) return;
  started = true;
  if (compact) document.body.classList.add("compact");
  $("row").classList.add("show");
  if (!navigator.geolocation) {show(false, "This browser can't share its location.", true); $("switch").disabled = true; return;}
  const state = await permission();
  if (state === "denied") {   // tapping still retries: the browser may ask again
    show(false, BLOCKED, true);
    if (followToo) sendValue({error: "denied"});
  }
  else if (chosen() === "on") {
    show(true, "On");
    if (followToo) {   // the Map's switch also follows the position while it is on
      const state2 = state === "granted" || await probe();
      if (state2) startFollowing();
      else {show(false, "Tap to turn on location."); sendValue({error: "off"});}   // the tap is the gesture the browser needs
    }
  } else {show(false, OFF); if (followToo) sendValue({error: "off"});}
  // The same on/off choice is shared with the other switch and other tabs.
  window.addEventListener("storage", event => {
    if (event.key !== KEY) return;
    if (chosen() === "on") {show(true, "On"); if (followToo) startFollowing();}
    else {show(false, OFF); stopFollowing(); if (followToo) sendValue({error: "off"});}
  });
  $("switch").addEventListener("click", async () => {
    if ($("switch").getAttribute("aria-checked") === "true") {
      choose("off"); show(false, OFF); stopFollowing();
      sendValue({error: "off"});
      return;
    }
    $("switch").disabled = true;
    show(true, "Asking your phone…");
    // This runs straight from the tap, so the browser shows its permission question now.
    navigator.geolocation.getCurrentPosition(position => {
      choose("on"); $("switch").disabled = false;
      const fix = reading(position);
      show(true, "On · accurate to about " + Math.round(fix.accuracy_m) + " m");
      sendValue(fix);
      if (followToo) {lastSent = fix; lastSentAt = Date.now(); latest = fix; startFollowing();}
    }, error => {
      const code = errorName(error);
      $("switch").disabled = false;
      if (code === "denied") {
        choose("off"); show(false, BLOCKED, true);
      } else {
        choose("on"); show(true, "On, but your phone can't find its position yet (" + code + "). Move closer to a window or outside.");
      }
      sendValue({error: code});
    }, {...OPTIONS, maximumAge: 0});
  });
}

window.addEventListener("message", event => {
  if (event.source !== window.parent || event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  if (args.tokens) $("tokens").textContent = args.tokens;
  if (args.mode === "switch") showSwitch(Boolean(args.compact), Boolean(args.follow)); else follow();
});
send("streamlit:componentReady", {apiVersion: 1});
send("streamlit:setFrameHeight", {height: 0});
</script></body></html>
