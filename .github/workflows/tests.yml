name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned app dependencies
        run: |
          python -m pip install --upgrade pip==26.3
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run the test suite
        run: python scripts/verify.py --group python
      - name: Audit installed dependencies
        run: |
          python -m pip list --format=freeze > "$RUNNER_TEMP/wegopub-dependencies.txt"
          python -m venv "$RUNNER_TEMP/wegopub-audit"
          "$RUNNER_TEMP/wegopub-audit/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/wegopub-audit/bin/python" -m pip_audit --disable-pip --no-deps -r "$RUNNER_TEMP/wegopub-dependencies.txt"
      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-verification
          path: .venv/verification.json
          include-hidden-files: true
          retention-days: 14

  components-and-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned test dependencies
        run: |
          python -m pip install --upgrade pip==26.3
          python -m pip install -r requirements.txt
          npm ci --ignore-scripts
          npm audit --audit-level=low
      - name: Check JavaScript components and PostgreSQL rules
        run: python scripts/verify.py --group components database
      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: components-and-database-verification
          path: .venv/verification.json
          include-hidden-files: true
          retention-days: 14
